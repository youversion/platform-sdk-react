name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locale-ownership:
    name: Locale Ownership
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Block manual locale edits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ACTOR: ${{ github.actor }}
        run: bash .github/scripts/check-locale-ownership.sh

  i18n-check:
    name: i18n Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run i18n parity check
        run: pnpm check:i18n

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          YVP_API_HOST: ${{ secrets.YVP_API_HOST }}
          YVP_APP_KEY: ${{ secrets.YVP_APP_KEY }}

      - name: Build coverage badge JSON for shields.io
        if: github.ref == 'refs/heads/main'
        run: |
          # Write badge artifacts to a scratch dir, never into main's tree.
          mkdir -p coverage-output

          # Core coverage
          if [ -f packages/core/coverage/coverage-summary.json ]; then
            CORE_PCT=$(jq '.total.lines.pct' packages/core/coverage/coverage-summary.json)
            CORE_COLOR=$(node -e "const p=$CORE_PCT; console.log(p >= 80 ? 'brightgreen' : p >= 60 ? 'yellow' : 'red')")
            echo "{\"schemaVersion\":1,\"label\":\"core coverage\",\"message\":\"${CORE_PCT}%\",\"color\":\"${CORE_COLOR}\"}" > coverage-output/core.json
          fi

          # Hooks coverage
          if [ -f packages/hooks/coverage/coverage-summary.json ]; then
            HOOKS_PCT=$(jq '.total.lines.pct' packages/hooks/coverage/coverage-summary.json)
            HOOKS_COLOR=$(node -e "const p=$HOOKS_PCT; console.log(p >= 80 ? 'brightgreen' : p >= 60 ? 'yellow' : 'red')")
            echo "{\"schemaVersion\":1,\"label\":\"hooks coverage\",\"message\":\"${HOOKS_PCT}%\",\"color\":\"${HOOKS_COLOR}\"}" > coverage-output/hooks.json
          fi

          # UI coverage
          if [ -f packages/ui/coverage/coverage-summary.json ]; then
            UI_PCT=$(jq '.total.lines.pct' packages/ui/coverage/coverage-summary.json)
            UI_COLOR=$(node -e "const p=$UI_PCT; console.log(p >= 80 ? 'brightgreen' : p >= 60 ? 'yellow' : 'red')")
            echo "{\"schemaVersion\":1,\"label\":\"ui coverage\",\"message\":\"${UI_PCT}%\",\"color\":\"${UI_COLOR}\"}" > coverage-output/ui.json
          fi

      - name: Publish coverage badges to badges branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Store badge JSON on a dedicated orphan `badges` branch so it never
          # pollutes main's history. Self-seeds the branch on first run.
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WORK_DIR="$(mktemp -d)"

          if git ls-remote --exit-code --heads "$REMOTE_URL" badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges --single-branch "$REMOTE_URL" "$WORK_DIR"
          else
            # Branch doesn't exist yet: start a fresh orphan history.
            git init -q "$WORK_DIR"
            git -C "$WORK_DIR" checkout -q --orphan badges
          fi

          # nullglob so a run that produced no badge JSON doesn't fail on a literal glob.
          shopt -s nullglob
          badges=(coverage-output/*.json)
          if [ ${#badges[@]} -eq 0 ]; then
            echo "No coverage badge JSON was produced; nothing to publish."
            exit 0
          fi
          cp "${badges[@]}" "$WORK_DIR"/
          git -C "$WORK_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$WORK_DIR" config user.name "github-actions[bot]"
          git -C "$WORK_DIR" add -A
          # Skip the commit/push entirely when nothing changed.
          if ! git -C "$WORK_DIR" diff --staged --quiet; then
            git -C "$WORK_DIR" commit -m "chore: update coverage badges"
            git -C "$WORK_DIR" push "$REMOTE_URL" HEAD:badges
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build
