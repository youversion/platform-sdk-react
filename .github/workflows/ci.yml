name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locale-ownership:
    name: Locale Ownership
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Block manual locale edits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ACTOR: ${{ github.actor }}
        run: bash .github/scripts/check-locale-ownership.sh

  i18n-check:
    name: i18n Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run i18n parity check
        run: pnpm check:i18n

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          YVP_API_HOST: ${{ secrets.YVP_API_HOST }}
          YVP_APP_KEY: ${{ secrets.YVP_APP_KEY }}

      - name: Build coverage badge JSON for shields.io
        run: |
          # Build one shields.io endpoint JSON per package into a scratch dir.
          mkdir -p coverage-output
          for pkg in core hooks ui; do
            summary="packages/$pkg/coverage/coverage-summary.json"
            # Fail loudly rather than silently skip: a missing summary must not
            # let a stale badge stand in for the current run.
            if [ ! -f "$summary" ]; then
              echo "Missing coverage summary: $summary" >&2
              exit 1
            fi
            PCT=$(jq '.total.lines.pct' "$summary")
            COLOR=$(node -e "const p=$PCT; console.log(p >= 80 ? 'brightgreen' : p >= 60 ? 'yellow' : 'red')")
            echo "{\"schemaVersion\":1,\"label\":\"$pkg coverage\",\"message\":\"${PCT}%\",\"color\":\"${COLOR}\"}" > "coverage-output/$pkg.json"
          done

      - name: Upload coverage badge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badges
          path: coverage-output/
          if-no-files-found: ignore

  # Publish the coverage badge JSON to a dedicated `badges` branch so it never
  # lands in main's history. Runs only on main; auth is handled by actions/checkout
  # (the workflow token, never baked into a URL).
  publish-coverage-badges:
    name: Publish coverage badges
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out badges branch
        uses: actions/checkout@v5
        with:
          ref: badges
          path: badges-branch

      - name: Download coverage badge artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-badges
          path: coverage-output

      - name: Commit coverage badges to badges branch
        working-directory: badges-branch
        run: |
          shopt -s nullglob
          badges=(../coverage-output/*.json)
          if [ ${#badges[@]} -eq 0 ]; then
            echo "No coverage badge JSON was produced; nothing to publish."
            exit 0
          fi
          # Replace the whole set so a package that produced no summary this run
          # drops its badge instead of showing stale coverage.
          rm -f ./*.json
          cp "${badges[@]}" .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update coverage badges"
          git push

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build
