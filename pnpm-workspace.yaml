packages:
  - "packages/*"
  - "examples/*"
  - "tools/*"
  # Note: shared/ is intentionally not a package - it contains source code
  # that gets bundled directly into the SDK packages

minimumReleaseAge: 4320 # 3-day cooldown — supply-chain attack mitigation

# Migrated from .npmrc — pnpm 11 only reads auth/registry settings from .npmrc,
# all other settings must live here (https://pnpm.io/blog/releases/11.0).
autoInstallPeers: true
strictPeerDependencies: false
# Hoist prettier and @types/* to the root node_modules so editor
# tooling and scripts can resolve them (pnpm 11 default publicHoistPattern is []).
publicHoistPattern:
  - "*prettier*"
  - "@types/*"

overrides:
  react: "19.1.2"
  react-dom: "19.1.2"
  "@types/react": "19.1.2"
  "@types/react-dom": "19.1.2"
  vite: "7.3.3"
  typescript: "7.0.2"
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': false # tsup uses esbuild; swc native build not needed
  esbuild: true
  msw: true
